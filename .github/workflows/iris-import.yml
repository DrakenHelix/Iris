name: Import reviewed Iris source
on:
  push:
    branches: [setup/source-import]
    paths: [iris-source-import.zip]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify and unpack the reviewed source
        run: |
          set -euo pipefail
          echo 'b89139eeac7662e2c8180f027415b2ed06caa095ee4b88cd294d6c514d0b1639  iris-source-import.zip' | sha256sum -c -
          unzip -oq iris-source-import.zip
          git rm -- iris-source-import.zip
          git add -- .gitattributes .gitignore README.md LICENSE CONTRIBUTING.md RELEASING.md Setup.cs Setup.manifest app build-msi.py build.ps1 payload-files.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import the reviewed Iris source under MIT'
          git push origin HEAD:refs/heads/setup/source-import
